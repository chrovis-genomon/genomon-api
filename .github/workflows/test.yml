name: test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup Java
      uses: actions/setup-java@v1
      with:
        java-version: 11
        architecture: x64

    - name: Setup Clojure
      uses: DeLaGuardo/setup-clojure@13
      with:
        lein: latest

    - name: Install dependencies
      run: lein deps

    - name: Run lein check
      run: >-
        ! lein check 2>&1 > /dev/null |
        grep genomon_api |
        sed -E 's/^Reflection warning, ([^:]+):([0-9]+):([0-9]+) - (.*)$/::warning file=\1,line=\2,col=\3::\4/' |
        grep '::warning'

    - name: Run tests
      run: |
        lein test
